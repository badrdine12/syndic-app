name: syndic_app
description: "تطبيق إدارة واجبات وأداءات سكنية للسانديك"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # قاعدة البيانات والمسارات
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # PDF والطباعة
  pdf: ^3.10.8
  printing: ^5.13.2

  # Excel والملفات
  excel: ^4.0.3
  file_picker: ^12.3.0
  share_plus: ^13.3.0

  # الروابط والواتساب
  url_launcher: ^6.2.6
  intl: ^0.20.2